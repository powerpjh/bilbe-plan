<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제이드의 52주 통독 마스터 앱</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #1a2a6c; margin-bottom: 30px; }
        .part { background-color: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; padding: 25px; border-left: 6px solid #1a2a6c; }
        .part-title { font-size: 1.4em; font-weight: bold; color: #1a2a6c; margin-bottom: 20px; border-bottom: 1px dashed #ddd; }
        .step { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #e9ecef; }
        .step-num { font-size: 1.1em; font-weight: bold; color: #e96479; margin-bottom: 10px; background: #ffeef1; padding: 2px 8px; border-radius: 4px; display: inline-block; }
        .book { margin-left: 10px; margin-bottom: 12px; }
        .book-title { font-weight: bold; color: #495057; display: block; margin-bottom: 6px; }
        .chapters { display: flex; flex-wrap: wrap; gap: 6px; }
        .chapter { border: 1px solid #ced4da; border-radius: 6px; padding: 5px 10px; background-color: #fff; cursor: pointer; user-select: none; transition: all 0.2s; }
        .chapter:hover { background-color: #e9ecef; }
        .chapter.checked { background-color: #2b8a3e; color: white; border-color: #2b8a3e; font-weight: bold; }
        #content-display { margin-top: 30px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #ccc; min-height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 제이드의 52주 성경통독 마스터</h1>
        <div id="plan-container"></div>
        <div id="content-display"><h3>구절을 클릭하면 성경 내용이 여기에 표시됩니다.</h3></div>
    </div>

    <script>
        const range = (start, end) => Array.from({length: end - start}, (_, i) => start + i);
        
        const bibleReadingPlan = [
            // (사용자님이 작성하신 기존 데이터가 이곳에 들어갑니다)
            // 데이터가 너무 길어 생략했으니, 보내주셨던 데이터 리스트를 그대로 붙여넣으세요!
            { "part_title": "PART 1: 초대 그리스도인이 현대 그리스도인에게", "steps": [ {"step_num": "STEP 01", "books": [{"title": "베드로전서", "chapters": range(1, 6)}, {"title": "마가복음", "chapters": range(1, 17)}, {"title": "베드로후서", "chapters": range(1, 4)}]} ] }
            // ... (나머지 전체 데이터)
        ];

        let fullBibleText = "";

        async function initApp() {
            const container = document.getElementById('plan-container');
            bibleReadingPlan.forEach(part => {
                let partHtml = `<div class="part"><div class="part-title">${part.part_title}</div>`;
                part.steps.forEach(step => {
                    partHtml += `<div class="step"><div class="step-num">${step.step_num}</div>`;
                    step.books.forEach(book => {
                        partHtml += `<div class="book"><span class="book-title">📍 ${book.title}</span><div class="chapters">`;
                        book.chapters.forEach(ch => {
                            partHtml += `<div class="chapter" onclick="toggleCheck(this, '${book.title}', ${ch})">${ch}</div>`;
                        });
                        partHtml += `</div></div>`;
                    });
                    partHtml += `</div>`;
                });
                partHtml += `</div>`;
                container.innerHTML += partHtml;
            });

            try {
                const response = await fetch('bible.txt');
                fullBibleText = await response.text();
            } catch (e) {
                console.log("파일 로드 실패");
            }
        }

        function loadContent(bookTitle, chapter) {
            const contentBox = document.getElementById('content-display');
            const escapedTitle = bookTitle.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`^${escapedTitle}${chapter}:.*`, 'gm');
            const matches = fullBibleText.match(regex);

            if (matches) {
                contentBox.innerHTML = `<h3>${bookTitle} ${chapter}장</h3><pre style="white-space: pre-wrap;">${matches.join('\n')}</pre>`;
            } else {
                contentBox.innerHTML = `<h3>${bookTitle} ${chapter}장</h3><p>내용을 찾을 수 없습니다. 파일 제목과 형식을 확인하세요.</p>`;
            }
        }

        function toggleCheck(element, title, chapter) {
            element.classList.toggle('checked');
            loadContent(title, chapter);
        }

        initApp();
    </script>
</body>
</html>
